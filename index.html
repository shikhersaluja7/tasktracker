<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📋 Task Manager</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <main class="main-content">
            <!-- Task Input Section -->
            <section class="input-section">
                <form id="taskForm" class="task-form">
                    <div class="form-group">
                        <input 
                            type="text" 
                            id="taskInput" 
                            class="task-input" 
                            placeholder="Add a new task..." 
                            required
                        >
                        <select id="prioritySelect" class="priority-select">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                        <button type="submit" class="add-btn">Add Task</button>
                    </div>
                </form>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <div class="task-stats">
                    <span id="taskCount">0 tasks</span>
                </div>
            </section>

            <!-- Task List Section -->
            <section class="tasks-section">
                <ul id="taskList" class="task-list">
                    <!-- Tasks will be inserted here -->
                </ul>
                <div id="emptyState" class="empty-state">
                    <p>✨ No tasks yet. Add one to get started!</p>
                </div>
            </section>

            <!-- Clear Completed Button -->
            <section class="actions-section">
                <button id="clearCompleted" class="clear-btn">Clear Completed</button>
            </section>
        </main>
    </div>

    <!-- Share Task Modal -->
    <div id="shareModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Share Task</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="shareEmail">Recipient Email:</label>
                    <input 
                        type="email" 
                        id="shareEmail" 
                        class="share-input" 
                        placeholder="recipient@example.com"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="shareMessage">Message (optional):</label>
                    <textarea 
                        id="shareMessage" 
                        class="share-textarea" 
                        placeholder="Add a personal message..."
                        rows="4"
                    ></textarea>
                </div>
                <div class="task-preview" id="taskPreview"></div>
            </div>
            <div class="modal-footer">
                <button id="cancelShare" class="cancel-btn">Cancel</button>
                <button id="confirmShare" class="share-btn">Send via Email</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
